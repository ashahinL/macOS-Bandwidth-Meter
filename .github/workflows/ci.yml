name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test and build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run test suite
        run: make test

      - name: Build the menu bar app and CLI
        run: make app

      - name: Build the disk image
        run: make dist

      - name: Verify the app bundle and disk image
        run: |
          plutil -lint "dist/Bandwidth Meter.app/Contents/Info.plist"
          file "dist/Bandwidth Meter.app/Contents/MacOS/BandwidthMeter"
          file dist/bandwidth-meter
          test -x dist/bandwidth-meter
          test -x "dist/Bandwidth Meter.app/Contents/Helpers/bandwidth-meter"
          dmg=$(ls dist/Bandwidth-Meter-*.dmg)
          hdiutil imageinfo "$dmg" | grep -q 'Format: ULFO'
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$mnt" "$dmg"
          ls -la "$mnt"
          installer -pkginfo -verbose -pkg "$mnt/Install.pkg"
          pkgutil --payload-files "$mnt/Install.pkg"
          codesign --verify --strict --deep "$mnt/Uninstall.app"
          test -f "$mnt/.background/background.tiff"
          hdiutil detach "$mnt"
