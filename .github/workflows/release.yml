name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run test suite
        run: make test

      - name: Build the disk image
        run: make dist

      - name: Drop old assets from an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          keep="Bandwidth-Meter-${tag#v}.dmg"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "no existing release for $tag"
            exit 0
          fi
          # Re-cutting a release that shipped zips leaves them behind, so
          # remove everything except the disk image this run uploads.
          gh release view "$tag" --json assets --jq '.assets[].name' \
            | while IFS= read -r name; do
                [[ "$name" == "$keep" ]] && continue
                echo "removing old asset $name"
                gh release delete-asset "$tag" "$name" --yes
              done

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="docs/release-notes/${VERSION}.md"
          out="$RUNNER_TEMP/release-notes.md"
          if [ -f "$notes" ]; then
            cp "$notes" "$out"
          else
            echo "no $notes, using the CHANGELOG section for $VERSION"
            awk -v v="$VERSION" '
              index($0, "## [" v "]") == 1 { on = 1; next }
              on && /^## \[/ { exit }
              on && /^\[[^]]+\]: / { exit }
              on { print }
            ' CHANGELOG.md > "$out"
          fi
          if ! grep -q '[^[:space:]]' "$out"; then
            echo "::error::No release notes for $VERSION. Add $notes or a CHANGELOG section."
            exit 1
          fi
          cat .github/release-downloads.md >> "$out"
          cat "$out"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Bandwidth Meter ${{ steps.version.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: dist/*.dmg
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
